<!DOCTYPE html>
<html>
<head>
    <title>Player Registration</title>
</head>
<body>
    <h1>Register New Player</h1>
    <form action="RegisterServlet" method="POST">
        <label for="gamerTag">Gamer Tag:</label>
        <input type="text" id="gamerTag" name="gamerTag" required>
        <br><br>
        <label for="initialCredits">Initial Credits:</label>
        <input type="number" id="initialCredits" name="initialCredits" required>
        <br><br>
        <button type="submit">Register</button>
    </form>
    <br>
    <a href="login.html">Back to Login</a>
</body>
</html>
